  <body>
    <div id="error-log" style="color: red; font-family: monospace; padding: 20px; z-index: 9999; position: absolute;"></div>
    <script>
      window.onerror = function(msg, source, lineno, colno, error) {
        var str = "Error: " + msg + "<br/>Source: " + source + ":" + lineno + ":" + colno;
        if (error && error.stack) str += "<br/>Stack: " + error.stack;
        document.getElementById('error-log').innerHTML += str + "<br/><br/>";
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('error-log').innerHTML += "Promise Error: " + event.reason + "<br/><br/>";
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
