<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Avatar</title>
    <!-- Three.js (Downgraded to r135 for three-vrm 0.6.x compatibility) -->
    <script src="https://unpkg.com/three@0.135.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.135.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.135.0/examples/js/controls/OrbitControls.js"></script>
    <!-- VRM Loader SDK (UMD build) -->
    <script src="https://unpkg.com/@pixiv/three-vrm@0.6.8/lib/three-vrm.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            color: white;
        }

        canvas {
            display: block;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: 100;
            display: flex;
            align-items: center;
        }

        #status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff4444;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px #ff4444;
            transition: all 0.3s ease;
        }

        #status-dot.active {
            background: #44ff44;
            box-shadow: 0 0 10px #44ff44;
        }

        #subtitle-container {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            text-align: center;
            pointer-events: none;
            z-index: 100;
        }

        #subtitle {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            color: #00f2ff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1.2rem;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
            border: 1px solid rgba(0, 242, 255, 0.5);
            opacity: 0;
            transition: opacity 0.5s ease;
            max-width: 100%;
            word-wrap: break-word;
        }

        #audio-standby {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            /* Hidden by default */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        #audio-standby h1 {
            color: #00f2ff;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #00f2ff;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        #audio-standby p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <div id="audio-standby">
        <h1>AUDIO STANDBY</h1>
        <p>SYSTEM READY - CLICK ANYWHERE TO WAKE</p>
    </div>

    <div id="hud">
        <span id="status-dot"></span>
        <span id="status-text">TRACKING: OFFLINE</span>
        <div id="cam-controls" style="margin-left: 20px; display: flex; gap: 8px; align-items: center;">
            <button onclick="zoomCamera(0.3)" title="Zoom In"
                style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer; border-radius: 4px; width: 26px; height: 26px; font-size: 16px;">+</button>
            <button onclick="zoomCamera(-0.3)" title="Zoom Out"
                style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer; border-radius: 4px; width: 26px; height: 26px; font-size: 16px;">−</button>
            <button onclick="fullBodyView()" title="Full Body"
                style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer; border-radius: 4px; padding: 0 8px; height: 26px; font-size: 10px;">FULL</button>
            <button onclick="resetCamera()" title="Reset Camera"
                style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer; border-radius: 4px; padding: 0 8px; height: 26px; font-size: 10px;">RESET</button>
        </div>
    </div>
    <div id="subtitle-container">
        <div id="subtitle"></div>
    </div>
    <script src="app.js"></script>
</body>

</html>
